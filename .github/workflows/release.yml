name: Release addon

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: addon-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Test
        run: |
          lua5.1 tests/forever-graphics.lua
          luac5.1 -p Core.lua
          luac5.1 -p Panel.lua

      - name: Build and verify ZIP
        id: package
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          versions = re.findall(r'^## Version: (\d+\.\d+\.\d+)$', Path('ForeverGraphics.toc').read_text(), re.M)
          assert len(versions) == 1, 'TOC must contain one major.minor.patch version'
          version = versions[0]
          archive = Path(os.environ['RUNNER_TEMP']) / f'ForeverGraphics-{version}.zip'
          files = ['Core.lua', 'Panel.lua', 'ForeverGraphics.toc', 'README.md', 'logo.png']
          if Path('LICENSE').is_file():
              files.append('LICENSE')
          with ZipFile(archive, 'w', ZIP_DEFLATED, compresslevel=9) as package:
              for name in files:
                  package.write(name, f'ForeverGraphics/{name}')
          with ZipFile(archive) as package:
              assert package.testzip() is None
              assert set(package.namelist()) == {f'ForeverGraphics/{name}' for name in files}
              for name in files:
                  assert package.read(f'ForeverGraphics/{name}') == Path(name).read_bytes()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\narchive={archive}\n')
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Version v$VERSION already exists. Increase the TOC version before publishing."
            exit 1
          fi
          gh release create "v$VERSION" "$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "GFX Settings $VERSION" \
            --generate-notes
